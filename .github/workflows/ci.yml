name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: bash scripts/test.sh
      - name: Release build, ad hoc signed
        run: SIGNING_IDENTITY=- bash scripts/build.sh
