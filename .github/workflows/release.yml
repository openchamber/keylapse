# Builds, signs with the Developer ID certificate, notarises and publishes a GitHub release
# whenever a version tag is pushed: `git tag v0.1.0 && git push origin v0.1.0`. The tag must
# match CFBundleShortVersionString in Resources/Info.plist.
#
# Repository secrets: APPLE_CERTIFICATE (the Developer ID Application .p12, base64),
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY (its name, "Developer ID Application: …"),
# APPLE_ID, APPLE_PASSWORD (an app-specific password), APPLE_TEAM_ID, and SPARKLE_PRIVATE_KEY
# (the EdDSA key that signs updates, from `generate_keys -x`; its public half is SUPublicEDKey
# in Resources/Info.plist). The release carries appcast.xml, which the installed app reads at
# https://github.com/openchamber/keylapse/releases/latest/download/appcast.xml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in Resources/Info.plist." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build, sign and notarise
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          UNIVERSAL=1 bash scripts/build.sh
          lipo -archs dist/Keylapse.app/Contents/MacOS/Keylapse
          spctl --assess --type execute --verbose=2 dist/Keylapse.app
          mkdir -p dist/release
          mv dist/Keylapse.zip "dist/release/Keylapse-$VERSION.zip"

      - name: Write the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          # What the in-app update window shows: the tag's message when it has one, else one line.
          # actions/checkout leaves the tag pointing at the commit, so fetch the real tag object.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES="$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' | sed '/^-----BEGIN/,$d')"
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] || NOTES=""
          [ -n "$NOTES" ] || NOTES="Keylapse $VERSION."
          printf '%s\n' "$NOTES" > "dist/release/Keylapse-$VERSION.txt"
          .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file "$RUNNER_TEMP/sparkle.key" \
            --download-url-prefix "https://github.com/openchamber/keylapse/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/openchamber/keylapse" \
            --embed-release-notes \
            -o dist/release/appcast.xml dist/release
          rm "$RUNNER_TEMP/sparkle.key"
          cat dist/release/appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/release/Keylapse-$VERSION.zip" dist/release/appcast.xml \
            --title "Keylapse $VERSION" \
            --notes-file "dist/release/Keylapse-$VERSION.txt"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
